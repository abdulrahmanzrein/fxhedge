            - generic [ref=f1e125]:
              - generic [ref=f1e126]:
                - heading "Natural hedge" [level=3] [ref=f1e127]
                - generic [ref=f1e128]: halal
              - paragraph [ref=f1e129]: Match your income and expenses in the same currency. Zero cost, zero riba exposure. Best if you already earn in your supplier's currency.
              - paragraph [ref=f1e130]: No contract involved, so no sarf question arises
            - generic [ref=f1e131]:
              - generic [ref=f1e132]:
                - heading "Murabaha (cost-plus sale)" [level=3] [ref=f1e133]
                - generic [ref=f1e134]: halal
              - paragraph [ref=f1e135]: Bank buys the currency at today's rate and sells it to you at a fixed markup. Widely accepted. Avoid if the markup is not disclosed upfront.
              - paragraph [ref=f1e136]: AAOIFI Sharia Standard No. 8 — Murabahah
            - generic [ref=f1e137]:
              - generic [ref=f1e138]:
                - heading "Wa'd (unilateral promise)" [level=3] [ref=f1e139]
                - generic [ref=f1e140]: debated
              - paragraph [ref=f1e141]: A promise, not a contract, to buy currency at a future date. A single unilateral promise is treated as binding on the promisor; two matching promises (muwa'adah) are widely held to replicate a forward. Check your madhab.
              - paragraph [ref=f1e142]: AAOIFI Sharia Standard No. 49 — Unilateral and Bilateral Promise
            - generic [ref=f1e143]:
              - generic [ref=f1e144]:
                - heading "Conventional forward" [level=3] [ref=f1e145]
                - generic [ref=f1e146]: caution
              - paragraph [ref=f1e147]: A contract to exchange currency at a fixed future rate. Deferring both legs conflicts with the spot-settlement rule for currency exchange (sarf), and it carries gharar. Generally not permissible.
              - paragraph [ref=f1e148]: AAOIFI Sharia Standard No. 1 — Trading in Currencies
