                - heading "Natural hedge" [level=3] [ref=f27e91]
                - generic [ref=f27e92]: halal
              - paragraph [ref=f27e93]: Match your income and expenses in the same currency. Zero cost, zero riba exposure. Best if you already earn in your supplier's currency.
            - generic [ref=f27e94]:
              - generic [ref=f27e95]:
                - heading "Murabaha (cost-plus sale)" [level=3] [ref=f27e96]
                - generic [ref=f27e97]: halal
              - paragraph [ref=f27e98]: Bank buys the currency at today's rate and sells it to you at a fixed markup. Widely accepted. Avoid if the markup is not disclosed upfront.
            - generic [ref=f27e99]:
              - generic [ref=f27e100]:
                - heading "Wa'd (unilateral promise)" [level=3] [ref=f27e101]
                - generic [ref=f27e102]: debated
              - paragraph [ref=f27e103]: "A promise, not a contract, to buy currency at a future date. Scholarly debate exists: some scholars accept it, others see binding wa'd as equivalent to a forward. Check your madhab."
            - generic [ref=f27e104]:
              - generic [ref=f27e105]:
                - heading "Conventional forward" [level=3] [ref=f27e106]
                - generic [ref=f27e107]: caution
              - paragraph [ref=f27e108]: A contract to exchange currency at a fixed future rate. Contains an element of gharar (uncertainty). Generally not permissible under Sharia.
