            - status [ref=f27e183]:
              - generic [ref=f27e184]:
                - generic [ref=f27e185]:
                  - paragraph [ref=f27e186]:
                    - text: In conventional finance, a
                    - strong [ref=f27e187]: forward contract
                    - text: is a binding, bilateral agreement where two parties commit today to exchange currencies at a future date at a fixed rate. However, under Islamic jurisprudence, currency exchange is governed by the rules of
                    - emphasis [ref=f27e188]: sarf
                    - text: (money exchange). According to the
                    - strong [ref=f27e189]: Shariyah Review Bureau
                    - text: ","
                    - emphasis [ref=f27e190]: sarf
                    - text: requires that when two currencies are exchanged, they must be handed over on the spot rather than deferred. Because conventional forwards defer both the delivery of currencies and the settlement, they fall foul of these rules and are generally considered non-compliant due to
                    - emphasis [ref=f27e191]: riba
                    - text: (unjust excess) and
                    - emphasis [ref=f27e192]: gharar
                    - text: (excessive uncertainty).
                  - paragraph [ref=f27e193]:
                    - text: In contrast, a
                    - strong [ref=f27e194]: wa'd
                    - text: translates to a unilateral "promise." In Sharia-compliant hedging structures, only
                    - emphasis [ref=f27e195]: one
                    - text: party makes a binding promise to purchase a currency at a specified future rate, rather than both parties entering into a bilateral deferred exchange contract today. According to
                    - strong [ref=f27e196]: HalalWallet
                    - text: ","
                    - strong [ref=f27e197]: AAOIFI Sharia Standard No. 65
                    - text: permits a single
                    - emphasis [ref=f27e198]: wa'd
                    - text: as legally and religiously binding on the promisor, while leaving the promisee uncommitted until the spot exchange actually occurs at maturity.
                  - paragraph [ref=f27e199]:
                    - text: However, there is legitimate scholarly disagreement surrounding this mechanism. While
                    - strong [ref=f27e200]: AAOIFI
                    - text: permits a single binding
                    - emphasis [ref=f27e201]: wa'd
                    - text: ", some scholars argue that using complex setups—such as two parallel promises ("
                    - emphasis [ref=f27e202]: parallel wa'd
                    - text: )—effectively mimics a conventional forward contract and constitutes
                    - emphasis [ref=f27e203]: muwa'adah
                    - text: (a bilateral mutual promise), which is prohibited. The
                    - strong [ref=f27e204]: International Islamic Fiqh Academy
                    - text: has historically taken a more cautious stance on using binding promises to lock in future currency exchanges.
                  - paragraph [ref=f27e205]:
                    - strong [ref=f27e206]: "Practical Precaution for Your Deal:"
                    - text: When managing a live exposure like your 45,000 GBP-USD payment with margin at risk, be aware that structured
                    - emphasis [ref=f27e207]: wa'd
                    - text: products are typically institutional bank-treasury instruments reserved for larger corporate clients. If you attempt to access an Islamic hedge through a bank, always demand the underlying contract in writing to ensure it relies on an approved unilateral
                    - emphasis [ref=f27e208]: wa'd
                    - text: or a commodity murabaha structure, rather than a re-labeled conventional forward. Alternatively, small importers often look into "natural hedging" (holding a USD balance in advance) to eliminate conversion risk without entering deferred derivatives.
                  - separator [ref=f27e209]
                  - paragraph [ref=f27e210]:
                    - emphasis [ref=f27e211]: This is general education, not a fatwa or financial advice. Scholars legitimately disagree on some of these structures. Before acting on any international payment, consult a qualified Sharia advisor and a regulated financial professional — and verify the actual structure your bank uses in writing.
                - paragraph [ref=f27e212]: This is general education, not a fatwa or financial advice. Consult a qualified scholar for a ruling specific to your situation.
